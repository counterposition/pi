name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - changeset-release/main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm # zizmor: ignore[cache-poisoning] branch-name match; releases publish via release-npm.yml on main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repo checks
        run: pnpm run check

      - name: Verify publishable packages
        run: pnpm run pack:check

      - name: Run JSR dry-run checks when needed
        run: |
          if ls packages/*/jsr.json >/dev/null 2>&1; then
            for manifest in packages/*/jsr.json; do
              package_dir=$(dirname "$manifest")
              echo "Running JSR dry-run for $package_dir"
              (
                cd "$package_dir"
                pnpm dlx jsr publish --dry-run
              )
            done
          else
            echo "No JSR packages found."
          fi

  compat:
    name: Test with Pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Oldest supported Pi. The lockfile tracks the latest tested Pi.
        pi:
          - 0.87.1
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm # zizmor: ignore[cache-poisoning] branch-name match; releases publish via release-npm.yml on main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Switch to Pi ${{ matrix.pi }}
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: |
          pnpm \
            --filter @counterposition/pi-auto-mode \
            --filter @counterposition/pi-memory \
            --filter @counterposition/pi-web-search \
            add --save-dev "@earendil-works/pi-ai@$PI_VERSION" "@earendil-works/pi-coding-agent@$PI_VERSION"

      - name: Show installed Pi
        run: pnpm -r list --depth 0 @earendil-works/pi-coding-agent

      - name: Run tests
        run: pnpm run test
